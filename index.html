<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raptor Tech | Roblox Development</title>
    
    <!-- Tailwind CSS & Config -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { dark: '#050505', neon: '#00D8FF', magenta: '#FF0055', purple: '#8A2BE2' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

    <!-- Google Fonts & Iconify -->
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap)" rel="stylesheet">
    <script src="[https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js](https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js)"></script>

    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased font-sans selection:bg-brand-neon selection:text-black">

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div id="canvas-container"></div>

    <nav class="fixed w-full z-50 top-0 border-b border-white/5 bg-brand-dark/50 backdrop-blur-md transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 md:px-12 py-4 flex justify-between items-center">
            <a href="#" class="text-xl font-black tracking-tighter hover-target flex items-center gap-2 text-white">
                RAPTOR<span class="text-brand-neon">TECH</span>
            </a>
            <div class="hidden md:flex items-center gap-8 font-mono text-sm">
                <a href="#about" class="hover-target text-white/70 hover:text-brand-neon transition-colors">關於</a>
                <a href="#shop" class="hover-target text-white/70 hover:text-brand-neon transition-colors">商城</a>
                <button id="discord-login-btn" class="group flex items-center gap-2 px-5 py-2.5 rounded-full bg-white/5 border border-white/10 hover:bg-[#5865F2] hover:border-[#5865F2] transition-all duration-300 hover-target ml-4">
                    <iconify-icon icon="simple-icons:discord" class="text-lg text-white/70 group-hover:text-white transition-colors"></iconify-icon>
                    <span class="font-bold text-white/70 group-hover:text-white transition-colors" id="discord-login-text">Discord 登入</span>
                </button>
            </div>
            <div class="md:hidden flex items-center">
                <button class="text-white hover-target p-2"><iconify-icon icon="solar:hamburger-menu-linear" class="text-2xl"></iconify-icon></button>
            </div>
        </div>
    </nav>

    <main class="relative z-10">
        <!-- Hero Section -->
        <section class="min-h-screen flex items-center justify-center pt-20 px-6">
            <div class="max-w-7xl mx-auto w-full text-center">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-brand-neon/30 bg-brand-neon/5 text-brand-neon font-mono text-sm mb-8 gsap-fade-up">
                    <span class="w-2 h-2 rounded-full bg-brand-neon animate-pulse"></span>
                    ROBLOX DEVELOPMENT STUDIO
                </div>
                <h1 class="text-6xl md:text-8xl lg:text-9xl font-black uppercase tracking-tighter leading-none mb-6 gsap-fade-up" style="animation-delay: 0.1s;">
                    BUILD THE <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-neon via-brand-purple to-brand-magenta">FUTURE</span>
                </h1>
                <p class="text-white/50 text-lg md:text-xl max-w-2xl mx-auto font-mono mb-10 gsap-fade-up" style="animation-delay: 0.2s;">
                    專注於 Roblox 平台的高階系統開發。提供從基礎框架到深度客製化的一站式解決方案。
                </p>
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4 gsap-fade-up" style="animation-delay: 0.3s;">
                    <a href="#shop" class="w-full sm:w-auto px-8 py-4 bg-white text-black font-bold font-mono rounded-none hover:bg-brand-neon transition-colors hover-target text-center">瀏覽商城</a>
                    <a href="[https://discord.gg/KxY3NckXDq](https://discord.gg/KxY3NckXDq)" target="_blank" class="w-full sm:w-auto px-8 py-4 border border-white/20 hover:border-white transition-colors font-mono hover-target flex items-center justify-center gap-2">加入 Discord <iconify-icon icon="simple-icons:discord"></iconify-icon></a>
                </div>
            </div>
        </section>

        <!-- Shop Section -->
        <section id="shop" class="py-32 relative z-10 border-t border-white/10 bg-brand-dark/50">
            <div class="max-w-7xl mx-auto px-6 md:px-12">
                <div class="mb-16 flex flex-col md:flex-row md:justify-between md:items-end gap-6 gsap-reveal">
                    <div>
                        <span class="font-mono text-brand-neon">/ 02 . STORE</span>
                        <h2 class="text-5xl md:text-7xl font-bold uppercase mt-4">精選產品<br><span class="text-outline">Top Products</span></h2>
                    </div>
                </div>
                <!-- 產品網格 (將由 JS 生成) -->
                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </div>
        </section>
        
        <footer class="py-12 border-t border-white/10 bg-black relative z-10">
            <div class="max-w-7xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-white/30 font-mono text-sm">&copy; 2026 Raptor Tech. All rights reserved.</div>
            </div>
        </footer>
    </main>

    <!-- 依賴套件 -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js](https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js](https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
    
    <!-- 引入外部 JS -->
    <script src="script.js"></script>
</body>
</html>
